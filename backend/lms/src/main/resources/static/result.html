<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSAT Result</title>
    <link rel="stylesheet" href="/result.css">
</head>
<body>
<div class="page">
    <header class="hero">
        <div>
            <p class="eyebrow">DSAT Result</p>
            <h1>레벨테스트 결과표</h1>
            <p class="muted">총점, 모듈 소요시간, 문항별 정오를 확인할 수 있습니다.</p>
        </div>
        <div class="hero-actions">
            <span id="result-status" class="badge">결과 불러오기 전</span>
            <button id="reload-result" class="ghost-button" type="button">결과 새로고침</button>
        </div>
    </header>

    <main class="grid">
        <section class="score-card span-2">
            <div>
                <p class="card-label">Your Total Score</p>
                <h2 id="total-score">0</h2>
            </div>
            <div class="score-meta">
                <p id="exam-name">시험 정보 없음</p>
                <strong id="section-score">Section Score 0</strong>
            </div>
        </section>

        <section class="card">
            <h3>Module 1</h3>
            <p class="time-value" id="module1-time">0초</p>
            <p class="muted" id="module1-correct">정답 수 0</p>
        </section>

        <section class="card">
            <h3>Module 2</h3>
            <p class="time-value" id="module2-time">0초</p>
            <p class="muted" id="module2-correct">정답 수 0</p>
        </section>

        <section class="card span-2">
            <div class="section-head">
                <h3>문항별 결과</h3>
                <span id="route-badge" class="badge">ROUTE</span>
            </div>
            <div id="result-table" class="list empty">assignmentId가 있으면 결과를 불러옵니다.</div>
        </section>
    </main>

    <div id="toast" class="toast" hidden></div>
</div>
<script src="/result.js"></script>
</body>
</html>
