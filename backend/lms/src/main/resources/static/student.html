<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSAT Student</title>
    <link rel="stylesheet" href="/student.css">
</head>
<body>
<div class="page">
    <header class="hero">
        <div>
            <p class="eyebrow">DSAT Student</p>
            <h1>레벨테스트 응시</h1>
            <p class="muted">배정된 시험을 확인하고, Module 1부터 순서대로 응시합니다.</p>
        </div>
        <div class="hero-actions">
            <span id="student-status" class="badge">로그인 전</span>
            <button id="load-assignments" class="ghost-button" type="button">시험 목록 불러오기</button>
        </div>
    </header>

    <main class="grid">
        <section class="card">
            <h2>학생 로그인</h2>
            <form id="student-login-form" class="stack">
                <label>
                    로그인 아이디
                    <input name="loginId" placeholder="student01" required>
                </label>
                <label>
                    비밀번호
                    <input name="password" type="password" placeholder="1234" required>
                </label>
                <button type="submit">로그인</button>
            </form>
            <p class="hint">학생 계정은 회원가입 후 사용할 수 있습니다.</p>
        </section>

        <section class="card">
            <h2>현재 시험 상태</h2>
            <div id="current-summary" class="list empty">시험을 선택하면 현재 모듈과 상태가 표시됩니다.</div>
        </section>

        <section class="card span-2">
            <div class="section-head">
                <h2>배정된 시험 목록</h2>
            </div>
            <div id="assignment-list" class="list empty">로그인 후 시험 목록을 불러오세요.</div>
        </section>

        <section class="card span-2">
            <div class="section-head">
                <h2>문제 풀이</h2>
                <div class="hero-actions">
                    <button id="start-module-1" class="ghost-button" type="button">Module 1 시작</button>
                    <button id="start-module-2" class="ghost-button" type="button">Module 2 시작</button>
                    <button id="submit-module" type="button">현재 모듈 제출</button>
                </div>
            </div>
            <div id="question-panel" class="list empty">시험을 선택하면 문제를 볼 수 있습니다.</div>
        </section>
    </main>

    <div id="toast" class="toast" hidden></div>
</div>
<script src="/student.js"></script>
</body>
</html>
