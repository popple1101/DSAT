<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSAT MVP</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
            color: #111827;
        }
        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        .hero {
            background: rgba(255,255,255,0.94);
            border: 1px solid #d8dde6;
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 42px;
        }
        p {
            color: #667085;
            line-height: 1.7;
        }
        .actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 28px;
        }
        a {
            display: block;
            padding: 18px 20px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 700;
            background: #111827;
            color: white;
            text-align: center;
        }
        a.secondary {
            background: #eef2f7;
            color: #111827;
        }
        .hint {
            margin-top: 20px;
            font-size: 14px;
        }
        @media (max-width: 700px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <section class="hero">
        <h1>DSAT 1차 MVP</h1>
        <p>관리자 문제 등록, 시험 세트 생성, 학생 배정, 학생 응시, 자동 채점, 결과표 조회까지 확인할 수 있는 시연용 시작 페이지입니다.</p>
        <div class="actions">
            <a href="/admin.html">관리자 콘솔 열기</a>
            <a class="secondary" href="/student.html">학생 응시 페이지 열기</a>
        </div>
        <p class="hint">데모 관리자 계정: `manager / 1234`, 데모 학생 계정: `student01 / 1234`</p>
    </section>
</div>
</body>
</html>
